services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: meterline
      POSTGRES_PASSWORD: meterline
      POSTGRES_DB: meterline
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meterline"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
